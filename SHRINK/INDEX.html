<!doctype html>
<html>
  <head>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hide-rules">
        <button id="hide-rules">Hide Rules</button>
    </div>
    <div class="rules">
      Guess higher or lower.<br />Correct=+1.<br />Wrong=0.<br />Same=safe.
    </div>
    <main class="game">
      <h1>Higher or Lower</h1>
      <div class="current-number" id="current-number">
        <span class="top-left"></span><span class="center"></span
        ><span class="bottom-right"></span>
      </div>
      <button id="high">High</button><button id="low">Low</button>
      <div class="result"></div>
      <div class="score"></div>
    </main>
    <div class="background"></div>
  </body>
</html>
